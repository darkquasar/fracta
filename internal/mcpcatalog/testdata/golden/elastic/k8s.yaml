apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-mcp
  namespace: fracta
  labels:
    app: fracta
    component: elastic-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fracta
      component: elastic-mcp
  template:
    metadata:
      labels:
        app: fracta
        component: elastic-mcp
    spec:
      containers:
        - name: elastic-mcp
          # External public image pulled by the cluster. See deployment/mcp-servers/elastic/README.md.
          image: docker.elastic.co/mcp/elasticsearch:latest
          imagePullPolicy: IfNotPresent
          args: ["http", "--address", "0.0.0.0:8000", "--sse"]
          ports:
            - containerPort: 8000
              name: mcp
          env:
            - name: ES_URL
              valueFrom:
                secretKeyRef:
                  name: elastic-mcp-secrets
                  key: url
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic-mcp-secrets
                  key: api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elastic-mcp
  namespace: fracta
  labels:
    app: fracta
    component: elastic-mcp
spec:
  selector:
    app: fracta
    component: elastic-mcp
  ports:
    - port: 3000
      targetPort: mcp    # container listens on 8000
      name: mcp
