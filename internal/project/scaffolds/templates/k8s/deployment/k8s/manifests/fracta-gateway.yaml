apiVersion: v1
kind: ConfigMap
metadata:
  name: fracta-gateway-config
  namespace: fracta
  labels:
    app: fracta
    component: fracta-gateway
data:
  fracta-k8s.yaml: |
    # Gateway-mode config — pod-facing endpoints
    # This is mounted into the gateway pod and used with --config flag
    logging:
      file: /workspace/logs/fracta.log
      level: info

    connections:
      falkordb:
        type: redis
        url: redis://falkordb.fracta.svc:6379
        graph_name: fracta_knowledge

    runtime:
      backend: kubernetes
      staging_dir: /workspace/staging
      state:
        driver: postgres
        postgres:
          dsn: "postgres://fracta:${POSTGRES_PASSWORD}@postgres.fracta.svc:5432/fracta?sslmode=disable"

    gateway:
      url: http://fracta-gateway.fracta.svc:8080
      listen: ":8080"

    mcp_servers:
      servers:
        elastic:
          remote:
            url: http://elastic-mcp.fracta.svc:3000/mcp
            transport: streamable-http
        vendor:
          remote:
            url: http://vendor-mcp.fracta.svc:3000/sse
            transport: sse
        notion:
          remote:
            url: https://mcp.notion.com/mcp
            transport: streamable-http
            auth:
              type: oauth
              token_file: /run/secrets/fracta-mcp-notion/token.json
              client_registration_file: /run/secrets/fracta-mcp-notion/client-registration.json

    strategy:
      dir: /opt/fracta/strategies
      pool_size: 1

    # ontology schemas are not mounted into the gateway pod yet.
    # TODO: mount graph-schema/ via ConfigMap or PVC volume.
    # ontology:
    #   schemas:
    #     - path: graph-schema/core
    #     - path: graph-schema/threat-hunting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fracta-gateway
  namespace: fracta
  labels:
    app: fracta
    component: fracta-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fracta
      component: fracta-gateway
  template:
    metadata:
      labels:
        app: fracta
        component: fracta-gateway
    spec:
      containers:
        - name: fracta-gateway
          image: ghcr.io/darkquasar/fracta:latest
          imagePullPolicy: IfNotPresent
          args:
            - fracta
            - serve
            - --gateway-mode
            - --config
            - /etc/fracta/fracta-k8s.yaml
            - --transport
            - http
            - --listen
            - ":8080"
            - --strategy-dir
            - /opt/fracta/strategies
            - --strategy-socket-mode
            - external
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FRACTA_STRATEGY_EXTERNAL
              value: "1"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            - name: ELASTIC_URL
              valueFrom:
                secretKeyRef:
                  name: elastic-mcp-secrets
                  key: url
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic-mcp-secrets
                  key: api-key
            - name: FALKORDB_URL
              value: "redis://falkordb.fracta.svc:6379"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/fracta
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: strategy-socket
              mountPath: /tmp
            - name: notion-oauth
              mountPath: /run/secrets/fracta-mcp-notion
              readOnly: true

        - name: strategy-runner
          image: ghcr.io/darkquasar/fracta:latest
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --project
            - /opt/fracta/strategies
            - python
            - /opt/fracta/strategies/runner.py
            - --socket
            - /tmp/fracta-strategy.sock
            - --strategy-dir
            - /opt/fracta/strategies
            - --graph-addr
            - falkordb.fracta.svc:6379
            - --graph-name
            - fracta_knowledge
          startupProbe:
            exec:
              command: ["test", "-S", "/tmp/fracta-strategy.sock"]
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["test", "-S", "/tmp/fracta-strategy.sock"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f '[r]unner.py' > /dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: strategy-socket
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: config
          configMap:
            name: fracta-gateway-config
        - name: workspace
          persistentVolumeClaim:
            claimName: fracta-workspace
        - name: strategy-socket
          emptyDir: {}
        - name: notion-oauth
          secret:
            secretName: fracta-mcp-notion
---
apiVersion: v1
kind: Service
metadata:
  name: fracta-gateway
  namespace: fracta
  labels:
    app: fracta
    component: fracta-gateway
spec:
  selector:
    app: fracta
    component: fracta-gateway
  ports:
    - port: 8080
      targetPort: http
      name: http

