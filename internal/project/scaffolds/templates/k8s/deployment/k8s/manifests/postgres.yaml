apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fracta
  labels:
    app: fracta
    component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: fracta
      component: postgres
  template:
    metadata:
      labels:
        app: fracta
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: fracta
            - name: POSTGRES_USER
              value: fracta
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fracta"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fracta
  labels:
    app: fracta
    component: postgres
spec:
  selector:
    app: fracta
    component: postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
