apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: fracta
  labels:
    app: fracta
    component: falkordb
spec:
  serviceName: falkordb
  replicas: 1
  selector:
    matchLabels:
      app: fracta
      component: falkordb
  template:
    metadata:
      labels:
        app: fracta
        component: falkordb
    spec:
      containers:
        - name: falkordb
          image: falkordb/falkordb:v4.16.9  # Pinned: 4.18.x has batch label REMOVE regression
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb
  namespace: fracta
  labels:
    app: fracta
    component: falkordb
spec:
  selector:
    app: fracta
    component: falkordb
  ports:
    - port: 6379
      targetPort: redis
      name: redis

