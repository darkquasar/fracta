# ===========================================================================
# gateway.yaml — Docker Compose Gateway (Server-Side)
# ===========================================================================
#
# This config runs INSIDE the gateway container. The gateway owns the
# agent-facing MCP tool surface:
#   - Proxies backend MCP tools to agents via HTTP
#   - Runs the strategy engine (via external sidecar socket)
#   - Provides graph and ontology tools
#   - Does NOT own agent lifecycle (that's the control plane)
#
# Agents connect to this container via GatewayURL:
#   http://gateway:8080/agents/{task}/mcp
#
# This file is bind-mounted into the container at /etc/fracta/gateway.yaml
# by deployment/docker-compose.yml.
# ===========================================================================


logging:
  file: /workspace/logs/fracta-gateway.log
  level: info


connections:
  falkordb:
    type: redis
    url: redis://falkordb:6379
    graph_name: fracta_knowledge


runtime:
  backend: local
  staging_dir: /workspace/staging
  state:
    driver: postgres
    postgres:
      dsn: "postgres://fracta:fracta@postgres:5432/fracta?sslmode=disable"


gateway:
  url: http://gateway:8080
  listen: ":8080"


strategy:
  dir: /opt/fracta/strategies
  pool_size: 1
  # gateway_access wires --gateway-url + --agent-task into the per-request
  # payload, enabling ctx.mcp.call_tool() from within strategies. Required
  # by any strategy that declares requires.mcp: true.
  gateway_access: true


ontology:
  schemas:
    # embed:// resolves families baked into the fracta binary at compile time.
    # For operator overrides, use file:///abs/path/to/<family>.
    # See docs/reference/configuration/ontology.md.
    - uri: embed://graph-schema/core
    - uri: embed://graph-schema/threat-hunting
    - uri: embed://graph-schema/fracta-mcp-gateway
    - uri: embed://graph-schema/knowledge-garden


# ---------------------------------------------------------------------------
# MCP Servers
# ---------------------------------------------------------------------------
# Backend MCP tool servers that this gateway proxies to agents. The scaffold
# leaves this empty — spec-43-mcp-server-scaffolds will introduce a templated
# pattern. For now, add MCP-server containers to deployment/docker-compose.yml and
# reference them here, e.g.:
#
# mcp_servers:
#   servers:
#     elastic:
#       remote:
#         url: http://elastic-mcp:8000/mcp
#         transport: streamable-http

mcp_servers:
  servers: {}
