# Docker Compose stack for fracta.
#
# Architecture mirrors K8s deployment:
#   - falkordb: knowledge graph (FalkorDB/Redis)
#   - postgres: state store and mission queue
#   - controlplane: lifecycle authority (HTTP API on :9090)
#   - gateway: MCP proxy + tool discovery (HTTP on :8080)
#   - strategy-runner: Python strategy engine sidecar (shared Unix socket with gateway)
#
# Auth helpers are bind-mounted from ./deployment/auth-helpers/ into every service
# that runs an agent runtime, so operators can swap providers (Bedrock /
# Vertex / Anthropic API / custom) by dropping a script into that directory.
#
# Usage:
#   docker compose -f deployment/docker-compose.yml up
#
# The host project directory ($PWD) is bind-mounted at /workspace for
# DirectoryWorkspace.
#
# MCP-server services (e.g. elastic, vendor) are intentionally not scaffolded
# by spec-42 — see spec-43-mcp-server-scaffolds for that work. Add MCP servers
# to your project as additional compose services.

services:
  falkordb:
    image: falkordb/falkordb:v4.16.9
    ports:
      - "16379:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fracta
      POSTGRES_PASSWORD: fracta
      POSTGRES_DB: fracta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fracta"]
      interval: 5s
      timeout: 3s
      retries: 5

  controlplane:
    image: ${FRACTA_IMAGE:-ghcr.io/darkquasar/fracta:latest}
    command:
      - fracta
      - serve
      - --control-plane-api-only
      - --config
      - /etc/fracta/controlplane.yaml
    ports:
      - "19090:9090"
    environment:
      AWS_REGION: "${AWS_REGION:-ap-southeast-2}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - ./configs/controlplane.yaml:/etc/fracta/controlplane.yaml:ro
      - ./auth-helpers:/opt/fracta/auth-helpers:ro
      - ${PWD}:/workspace:rw
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: ${FRACTA_IMAGE:-ghcr.io/darkquasar/fracta:latest}
    command:
      - fracta
      - serve
      - --gateway-mode
      - --config
      - /etc/fracta/gateway.yaml
      - --transport
      - http
      - --listen
      - ":8080"
      - --strategy-dir
      - /opt/fracta/strategies
      - --strategy-socket-mode
      - external
    ports:
      - "8080:8080"
    environment:
      FRACTA_STRATEGY_EXTERNAL: "1"
    volumes:
      - ./configs/gateway.yaml:/etc/fracta/gateway.yaml:ro
      - ./auth-helpers:/opt/fracta/auth-helpers:ro
      - ${PWD}:/workspace:rw
      - strategy-socket:/tmp
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  strategy-runner:
    image: ${FRACTA_IMAGE:-ghcr.io/darkquasar/fracta:latest}
    # --gateway-url + --agent-task default the inline MCP gateway connection
    # for strategies that call ctx.mcp.call_tool() (e.g. highlight-distill,
    # notion-publish). Required when strategy.gateway_access: true in
    # configs/gateway.yaml. Closes Bug 12.
    command:
      - uv
      - run
      - --project
      - /opt/fracta/strategies
      - python
      - /opt/fracta/strategies/runner.py
      - --socket
      - /tmp/fracta-strategy.sock
      - --strategy-dir
      - /opt/fracta/strategies
      - --graph-addr
      - falkordb:6379
      - --graph-name
      - fracta_knowledge
      - --gateway-url
      - http://gateway:8080
      - --agent-task
      - default
    volumes:
      - strategy-socket:/tmp
      - ${PWD}:/workspace:rw
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/tmp/fracta-strategy.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  falkordb-data:
  postgres-data:
  strategy-socket:
