# ===========================================================================
# fracta.yaml — Local Kubernetes Mode (Host-Side Thin Client)
# ===========================================================================
#
# This config is used on the host machine to connect to an in-cluster
# Kubernetes control plane. The host is a pure thin client — all lifecycle
# authority (spawn, queue, workers, state) runs inside the K8s cluster.
#
# Architecture:
#   Host (this config)          K8s Cluster
#   ─────────────────           ──────────────────────────────
#   fracta serve ──HTTP──────────→ controlplane pod (:9090)
#     (thin client)               ├─ Postgres (state/queue)
#                                 ├─ Workers (in-process)
#                                 └─ KubernetesBackend (agent Jobs)
#                                gateway pod (:8080)
#                                 ├─ MCP proxy tools
#                                 ├─ Strategy sidecar
#                                 └─ Graph/ontology tools
#
# The control plane and gateway run as K8s Deployments defined in
# deployment/k8s-local-cluster/manifests/fracta-controlplane.yaml and deployment/k8s-local-cluster/manifests/fracta-gateway.yaml.
# Their server-side configs are baked into K8s ConfigMaps.
#
# Prerequisites:
#   kubectl port-forward -n fracta svc/fracta-controlplane 9090:9090
#
# Run with:
#   fracta serve --config deployment/k8s-local-cluster/client/fracta.yaml
# ===========================================================================


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

logging:
  level: info


# ---------------------------------------------------------------------------
# Control Plane API
# ---------------------------------------------------------------------------
# Points the thin client at the in-cluster control plane.
# When control_plane_api.url is set, the thin client connects directly
# to that URL without auto-starting a local daemon.

control_plane_api:
  url: http://localhost:9090
