[project]
name = "fracta-strategies"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.0",
    "duckdb>=1.0",
    "falkordb>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "redis>=5.0",
    "requests>=2.31",
    "tldextract>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fracta_strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
