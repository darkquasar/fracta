# Reference binding for the elastic-field-survey strategy.
#
# This file is environment-specific. When you copy this strategy into your
# own strategies/ tree, edit this binding to match your Elasticsearch setup —
# config_key, index_pattern, and any field renames live here.
#
# The contract.yaml and strategy.py files are publishable and portable;
# this binding.yaml is what makes them concrete in *your* environment.

source_bindings:

  es_indices:
    backend: elasticsearch
    config_key: elastic              # ← change to your Elasticsearch config key
    fetch_mode: fracta_mcp_gateway   # gateway pulls directly; LLM never sees the rows
    mcp_tool: list_indices
    mcp_server: elastic              # ← change to your registered MCP server name
    mcp_args:
      pattern: "{{index_pattern}}"   # contract param threaded into the tool call
    field_map:
      index: index
      docs: docs.count
      size: store.size

  es_mappings:
    backend: elasticsearch
    config_key: elastic
    fetch_mode: fracta_mcp_gateway
    mcp_tool: get_mappings
    mcp_server: elastic
    mcp_args:
      pattern: "{{index_pattern}}"
    field_map:
      index: index
      field_name: field
      field_type: type
