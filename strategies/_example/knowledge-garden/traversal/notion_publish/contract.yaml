name: "notion-publish"
version: "1.0.0"
description: >
  Publish Concept(s) to a Notion database, idempotent via Publication.
  Derives Concept.epistemic_status from Concept.confidence
  (<0.4 seedling, 0.4-0.8 budding, >0.8 evergreen) and writes it to the
  graph before rendering. All four Notion tool calls go through
  ctx.mcp.call_tool directly.
tags: [traversal, knowledge-garden, notion]
params:
  concept_name:
    type: str
    required: false
    description: "Single concept to publish; omit for batch (top-N by confidence)"
  notion_database_id:
    type: str
    required: true
    description: "Notion database (data source) id of the destination DB"
  batch_size:
    type: int
    required: false
    default: 10
    description: "Number of top-confidence Concepts to publish when concept_name is omitted"
requires:
  graph: true
  tables: {}
pinned_backend: notion
discovery:
  description: >
    Reads Concepts and supporting Highlights from the graph; writes
    Notion pages via the notion MCP server. Idempotent via the
    Publication node (sink + external_id + content_hash).
  mcp_hints:
    - tool: "notion.notion-query-data-sources"
      purpose: "Lookup an existing Notion page by concept_name property (adopt path)"
    - tool: "notion.notion-create-pages"
      purpose: "Create a new Notion page when no Publication and no adoptable page exists"
    - tool: "notion.notion-update-page"
      purpose: "Update page properties (epistemic_status, content_hash)"
    - tool: "notion.append-block-children"
      purpose: "Replace block children with the newly rendered concept body"
