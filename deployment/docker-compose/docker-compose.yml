# Docker Compose stack for fracta.
#
# Architecture mirrors K8s deployment:
#   - falkordb: knowledge graph (FalkorDB/Redis)
#   - postgres: state store and mission queue
#   - controlplane: lifecycle authority (HTTP API on :9090)
#   - gateway: MCP proxy + tool discovery (HTTP on :8080)
#   - strategy-runner: Python strategy engine sidecar (shared Unix socket with gateway)
#   - elastic-mcp: Elasticsearch MCP server (proxied by gateway)
#   - vendor-mcp: VendorSecurity Generic MCP server (proxied by gateway)
#
# Usage:
#   docker compose -f deployment/docker-compose/docker-compose.yml up
#   bin/fracta serve --config deployment/docker-compose/client/fracta.yaml
#   fracta spawn --task my-agent           # spawn through compose stack
#
# The host project directory is bind-mounted at /workspace for DirectoryWorkspace.

services:
  falkordb:
    image: falkordb/falkordb:v4.16.9
    ports:
      - "16379:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fracta
      POSTGRES_PASSWORD: fracta
      POSTGRES_DB: fracta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fracta"]
      interval: 5s
      timeout: 3s
      retries: 5

  controlplane:
    build:
      context: ../..
    command:
      - fracta
      - serve
      - --control-plane-api-only
      - --config
      - /etc/fracta/controlplane.yaml
    ports:
      - "19090:9090"
    environment:
      AWS_REGION: "${AWS_REGION:-ap-southeast-2}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - ./configs/controlplane.yaml:/etc/fracta/controlplane.yaml:ro
      - ../..:/workspace:rw
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ../..
    command:
      - fracta
      - serve
      - --gateway-mode
      - --config
      - /etc/fracta/gateway.yaml
      - --transport
      - http
      - --listen
      - ":8080"
      - --strategy-dir
      - /opt/fracta/strategies
      - --strategy-socket-mode
      - external
    ports:
      - "8080:8080"
    environment:
      FRACTA_STRATEGY_EXTERNAL: "1"
    volumes:
      - ./configs/gateway.yaml:/etc/fracta/gateway.yaml:ro
      - ../..:/workspace:rw
      - strategy-socket:/tmp
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  strategy-runner:
    build:
      context: ../..
    command:
      - uv
      - run
      - --project
      - /opt/fracta/strategies
      - python
      - /opt/fracta/strategies/runner.py
      - --socket
      - /tmp/fracta-strategy.sock
      - --strategy-dir
      - /opt/fracta/strategies
      - --graph-addr
      - falkordb:6379
      - --graph-name
      - fracta_knowledge
    volumes:
      - strategy-socket:/tmp
      - ../..:/workspace:rw
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/tmp/fracta-strategy.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  elastic-mcp:
    image: docker.elastic.co/mcp/elasticsearch:latest
    command: ["http", "--address", "0.0.0.0:8000", "--sse"]
    environment:
      ES_URL: "${ELASTIC_URL}"
      ES_API_KEY: "${ELASTIC_API_KEY}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/sse\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vendor-mcp:
    build:
      context: ../mcp-servers/vendor
    environment:
      VENDOR_MCP_CONSOLE_BASE_URL: "${VENDOR_MCP_CONSOLE_BASE_URL:-}"
      VENDOR_MCP_CONSOLE_TOKEN: "${VENDOR_MCP_CONSOLE_TOKEN:-}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/sse\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  falkordb-data:
  postgres-data:
  strategy-socket:
