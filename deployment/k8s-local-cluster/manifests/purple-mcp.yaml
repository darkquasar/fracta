apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-mcp
  namespace: fracta
  labels:
    app: fracta
    component: vendor-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fracta
      component: vendor-mcp
  template:
    metadata:
      labels:
        app: fracta
        component: vendor-mcp
    spec:
      containers:
        - name: vendor-mcp
          # Repo-owned image. Dockerfile: mcp-servers/vendor/Dockerfile.
          image: fracta/vendor-mcp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: mcp
          env:
            - name: VENDOR_MCP_CONSOLE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: vendor-mcp-secrets
                  key: console-base-url
            - name: VENDOR_MCP_CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vendor-mcp-secrets
                  key: console-token
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-mcp
  namespace: fracta
  labels:
    app: fracta
    component: vendor-mcp
spec:
  selector:
    app: fracta
    component: vendor-mcp
  ports:
    - port: 3000
      targetPort: mcp
      name: mcp
