apiVersion: batch/v1
kind: Job
metadata:
  name: spike-claude-ping
  namespace: fracta
  labels:
    app: fracta
    purpose: spike-validation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: fracta
        component: spike-claude
    spec:
      restartPolicy: Never
      containers:
        - name: claude
          image: fracta/spike:latest
          imagePullPolicy: Never
          args:
            - "-p"
            - "Respond with only the word 'pong'"
            - "--output-format"
            - "json"
            - "--permission-mode"
            - "dontAsk"
          env:
            - name: BEDROCK_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fracta-spike-auth
                  key: bearer-token
            - name: ANTHROPIC_MODEL
              value: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
