apiVersion: v1
kind: ServiceAccount
metadata:
  name: fracta-agent
  namespace: fracta
  labels:
    app: fracta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fracta-job-manager
  namespace: fracta
  labels:
    app: fracta
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fracta-job-manager-binding
  namespace: fracta
  labels:
    app: fracta
subjects:
  - kind: ServiceAccount
    name: fracta-agent
    namespace: fracta
roleRef:
  kind: Role
  name: fracta-job-manager
  apiGroup: rbac.authorization.k8s.io
