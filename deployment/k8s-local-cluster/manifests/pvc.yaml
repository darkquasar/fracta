apiVersion: v1
kind: PersistentVolume
metadata:
  name: fracta-spike-pv
  labels:
    app: fracta
    purpose: spike-validation
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  storageClassName: fracta-local
  hostPath:
    path: /tmp/fracta-spike
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fracta-spike-pvc
  namespace: fracta
  labels:
    app: fracta
    purpose: spike-validation
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fracta-local
  resources:
    requests:
      storage: 1Gi
