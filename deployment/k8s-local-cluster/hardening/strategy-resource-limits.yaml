# Strategy Pod Resource Limits (template)
#
# Template for resource limits on strategy execution pods. These limits
# prevent resource exhaustion attacks (CPU/memory/disk bombs) and ensure
# fair scheduling in a shared cluster.
#
# Defense layers provided:
#   - Memory limit: OOM-killed if strategy exceeds 2Gi
#   - CPU limit: Throttled (not killed) if strategy exceeds 1 core
#   - Ephemeral storage: Evicted if staging data exceeds 1Gi
#   - activeDeadlineSeconds: Hard wall-clock timeout for the entire pod
#
# Tuning guidance:
#   - Memory 2Gi supports DuckDB analysis of ~500K-1M rows in-memory.
#     Increase for strategies processing very large datasets.
#   - CPU 1000m is sufficient for single-threaded DuckDB + Python.
#     DuckDB can use multiple cores; increase for parallel workloads.
#   - Ephemeral storage 1Gi covers Parquet staging for ~500K rows.
#     Parquet is compressed (2-10 MB per 100K rows), so 1Gi is generous.
#   - activeDeadlineSeconds 300 (5 min) is the default timeout.
#     Override per strategy via contract.yaml or runtime config.
#
# Trust-tier adjustments:
#   Trusted:      CPU 1000m/250m, Memory 2Gi/512Mi, deadline 600s
#   Semi-trusted: CPU 500m/100m,  Memory 1Gi/256Mi, deadline 300s
#   Untrusted:    CPU 250m/50m,   Memory 512Mi/128Mi, deadline 120s
apiVersion: v1
kind: Pod
metadata:
  name: fracta-strategy
  labels:
    app: fracta
    component: strategy-sidecar
spec:
  # Hard wall-clock timeout: pod is killed after this many seconds.
  # Prevents runaway strategies from consuming resources indefinitely.
  activeDeadlineSeconds: 300

  containers:
    - name: strategy
      image: fracta-strategy:latest
      resources:
        requests:
          # Minimum guaranteed resources for scheduling.
          cpu: "250m"
          memory: "512Mi"
        limits:
          # Maximum resources before throttling (CPU) or OOM kill (memory).
          cpu: "1000m"
          memory: "2Gi"
          # Ephemeral storage covers Parquet staging files in /tmp.
          ephemeral-storage: "1Gi"
