id: readwise
name: Readwise / Reader
category: knowledge
status: tested
description: Official hosted MCP for Readwise highlights and Reader documents.
upstream:
  type: official
  url: https://readwise.io/mcp
auth:
  modes:
    - oauth
  notes: Hosted server requires OAuth with PKCE. Drive the flow with `fracta config mcp auth login readwise`; tokens persist to the OS keyring under service `fracta.oauth`.
variants:
  remote:
    transport: streamable-http
    url: https://mcp2.readwise.io/mcp
    auth: oauth
    fracta_native: supported  # OAuth driven by `fracta config mcp auth login readwise`; tokens exported as k8s Secret and mounted into the gateway
  local_proxy:
    transport: stdio
    command: npx
    args:
      - -y
      - mcp-remote
      - https://mcp2.readwise.io/mcp
    auth: oauth_via_mcp_remote
    notes: Fallback for environments without a fracta gateway (e.g. local-process mode against a hosted MCP). Caches tokens in ~/.mcp-auth/ as plaintext.
support:
  local_process: supported_via_local_proxy
  docker_compose: supported_via_secret_mount  # native OAuth: export with `fracta config mcp auth export readwise --format env` and mount as compose secrets/env
  kubernetes: supported  # native OAuth: see docs/patterns/reading-garden/setup.mdx Step 1
docker:
  dockerfile: ""
  build_target: ""
  load_target: ""
verification:
  tested_on: ""  # pending live smoke — see spec-41 Phase 6 (owner task O1)
  smoke_test: list_tools
  expected_tools_contains:
    - list_highlights
    - list_documents
    - list_tags
notes: High-priority knowledge gardening source for highlights, saved articles, Reader inbox triage, and resurfacing reading history.
