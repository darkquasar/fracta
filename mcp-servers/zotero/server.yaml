id: zotero
name: Zotero
category: knowledge
status: candidate
description: Community MCP options for searching research libraries, citations, PDFs, and annotations.
upstream:
  type: community
  url: https://github.com/kujenga/zotero-mcp
auth:
  modes:
    - env_token
    - none
  env_optional:
    - ZOTERO_API_KEY
    - ZOTERO_LIBRARY_ID
    - ZOTERO_LOCAL
  notes: env_token (ZOTERO_API_KEY) talks to the cloud library. Setting ZOTERO_LOCAL=true switches to the local Zotero desktop instead — no token needed; fracta inherits the desktop app's trust by running on the same machine.
variants:
  local:
    transport: stdio
    command: uvx
    args:
      - zotero-mcp
    env:
      optional:
        - ZOTERO_API_KEY
        - ZOTERO_LIBRARY_ID
        - ZOTERO_LOCAL
support:
  local_process: supported_candidate
  docker_compose: possible_with_api_credentials
  kubernetes: possible_with_api_credentials
docker:
  dockerfile: ""
  build_target: ""
  load_target: ""
verification:
  tested_on: ""
  smoke_test: list_tools
  expected_tools_contains:
    - zotero_search_items
    - zotero_item_metadata
notes: Prioritize for research-heavy users. Exact package/server choice should be smoke-tested before promoting to tested.
