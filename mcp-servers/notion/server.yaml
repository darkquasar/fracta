id: notion
name: Notion
category: knowledge
status: tested
description: Official hosted MCP for Notion pages, databases, comments, search, and workspace updates.
upstream:
  type: official
  url: https://developers.notion.com/guides/mcp/overview
auth:
  modes:
    - oauth
  notes: Hosted Notion MCP requires OAuth with PKCE. Static Notion integration tokens do not authenticate the hosted MCP endpoint. Drive the OAuth flow with `fracta config mcp auth login notion`; tokens persist to the OS keyring under service `fracta.oauth`.
variants:
  remote:
    transport: streamable-http
    url: https://mcp.notion.com/mcp
    auth: oauth
    fracta_native: supported  # OAuth driven by `fracta config mcp auth login notion`; tokens exported as k8s Secret and mounted into the gateway
  remote_sse:
    transport: sse
    url: https://mcp.notion.com/sse
    auth: oauth
    fracta_native: supported
  local_proxy:
    transport: stdio
    command: npx
    args:
      - -y
      - mcp-remote
      - https://mcp.notion.com/mcp
    auth: oauth_via_mcp_remote
    notes: Fallback for environments without a fracta gateway (e.g. local-process mode against a hosted MCP). Caches tokens in ~/.mcp-auth/ as plaintext.
support:
  local_process: supported_via_local_proxy
  docker_compose: supported_via_secret_mount  # native OAuth: export with `fracta config mcp auth export notion --format env` and mount as compose secrets/env
  kubernetes: supported  # native OAuth: see docs/patterns/reading-garden/setup.mdx Step 1
docker:
  dockerfile: ""
  build_target: ""
  load_target: ""
verification:
  tested_on: ""  # pending live smoke — see spec-41 Phase 6 (owner task O1)
  smoke_test: list_tools
  expected_tools_contains:
    - notion-search
    - notion-fetch
    - notion-create-pages
    - notion-update-page
    - notion-move-pages
    - notion-duplicate-page
    - notion-create-database
    - notion-update-database
    - notion-query-data-sources
    - notion-create-comment
    - notion-get-comments
    - notion-get-users
    - notion-get-self
    - notion-get-user
    - notion-get-teams
    - append-block-children
    - get-block-children
    - delete-block
notes: Best mainstream workspace-backed knowledge base target. Native remote support shipped — drive OAuth with `fracta config mcp auth login notion`, export tokens, mount into the gateway.
