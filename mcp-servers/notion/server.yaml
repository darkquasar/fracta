id: notion
name: Notion
category: knowledge
status: tested
description: Official hosted MCP for Notion pages, databases, comments, search, and workspace updates.
upstream:
  type: official
  url: https://developers.notion.com/guides/mcp/overview
auth:
  modes:
    - oauth
  notes: Hosted Notion MCP requires OAuth with PKCE. Static Notion integration tokens do not authenticate the hosted MCP endpoint.
variants:
  remote:
    transport: streamable-http
    url: https://mcp.notion.com/mcp
    auth: oauth
    fracta_native: blocked_until_gateway_oauth
  remote_sse:
    transport: sse
    url: https://mcp.notion.com/sse
    auth: oauth
    fracta_native: blocked_until_gateway_oauth
  local_proxy:
    transport: stdio
    command: npx
    args:
      - -y
      - mcp-remote
      - https://mcp.notion.com/mcp
    auth: oauth_via_mcp_remote
support:
  local_process: supported_via_local_proxy
  docker_compose: blocked_until_gateway_oauth_or_proxy_packaging
  kubernetes: blocked_until_gateway_oauth_token_store
docker:
  dockerfile: ""
  build_target: ""
  load_target: ""
verification:
  tested_on: ""  # pending live smoke — see spec-41 Phase 6 (owner task O1)
  smoke_test: list_tools
  expected_tools_contains:
    - notion-search
    - notion-fetch
    - notion-create-pages
    - notion-update-page
    - notion-move-pages
    - notion-duplicate-page
    - notion-create-database
    - notion-update-database
    - notion-query-data-sources
    - notion-create-comment
    - notion-get-comments
    - notion-get-users
    - notion-get-self
    - notion-get-user
    - notion-get-teams
    - append-block-children
    - get-block-children
    - delete-block
notes: Best mainstream workspace-backed knowledge base target. Native remote support needs fracta OAuth.
