id: concept-spacy
name: Concept spaCy MCP
category: nlp
status: candidate
description: >-
  spaCy NER and noun-chunk extraction exposed as a single MCP tool.
upstream:
  type: first_party
  url: https://github.com/darkquasar/fracta-mcp-servers
auth:
  modes:
    - none
  notes: |
    No auth at the MCP layer. The fracta gateway provides per-agent
    policy and observability; this server trusts the gateway envelope.
variants:
  container:
    image: ghcr.io/darkquasar/fracta-mcp-servers/concept-spacy:latest
    image_owner: fracta
    transport: streamable-http
    service_url: http://concept-spacy.fracta.svc:8000/mcp
    # Rough sizing — informed estimates, not measured under sustained load.
    # spaCy en_core_web_sm is ~50 MB resident; no torch, no GPU codepath.
    # Single-threaded inference, so CPU > 1 is wasted. Mirrors the upstream
    # entry-level `resources:` block; see the FOLLOWUP note in
    # mcp-servers/README.md.
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
support:
  local_process: not_supported
  docker_compose: supported
  kubernetes: supported
docker:
  dockerfile: ""
  build_target: ""
  load_target: ""
verification:
  tested_on: ""
  smoke_test: list_tools
  expected_tools_contains:
    - spacy_extract_tool
notes: |
  Image built and published by github.com/darkquasar/fracta-mcp-servers
  (see servers/concept-spacy/). fracta consumes the published GHCR
  image only — fracta does not own the Dockerfile.

  One of three successors to the retired concept-extractor monolith
  (split into per-library servers so operators only pull what they use).

  Default model (override via env on the container):
    CONCEPT_SPACY_MODEL = en_core_web_sm
