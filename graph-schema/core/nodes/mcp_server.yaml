label: MCPServer
layer: universal
description: >
  An MCP server connection (1:1 with fracta.yaml server entries). Replaces DataSource.

properties:
  config_key:
    type: string
    required: true
    unique: true
    description: Key into fracta.yaml connections section
  type:
    type: string
    required: true
    description: Backend type (elasticsearch, snowflake, splunk, s3, mcp)
  status:
    type: string
    required: false
    description: Server status (active, degraded, offline)
  url:
    type: string
    required: false
    description: Server URL

indexes:
  - properties: [config_key]
    type: exact
