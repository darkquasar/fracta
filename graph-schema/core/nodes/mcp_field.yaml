label: MCPField
layer: universal
description: >
  A field returned by an MCP tool.

properties:
  name:
    type: string
    required: true
  type:
    type: string
    required: true
  semantic:
    type: string
    required: false
    ref: semantics
  _status:
    type: string
    required: false
    description: "Lifecycle status: speculative, confirmed, stale"
  _confirmed_at:
    type: string
    required: false
    description: "RFC3339 timestamp when status was confirmed"

indexes:
  - properties: [name]
    type: exact
