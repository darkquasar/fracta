label: Event
layer: particular
description: A specific observed event from a log source.

properties:
  id:
    type: string
    required: true
    unique: true
  timestamp:
    type: string
    required: true
  severity:
    type: string
    required: false
  description:
    type: string
    required: false

indexes:
  - properties: [id]
    type: exact
  - properties: [timestamp]
    type: exact
