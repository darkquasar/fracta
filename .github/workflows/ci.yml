name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy check
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -timeout 5m

      # Catalogue drift check: PRs that change strategies must commit the
      # regenerated catalogue too. The generator runs read-only here (no
      # commit) — it only diffs what *would* be generated against what's
      # committed. Fails the PR if they disagree, so we don't merge a state
      # the post-merge workflow would then immediately overwrite.
      - name: Set up Python (for catalogue drift check)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install catalogue generator deps
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Catalogue drift check
        run: python scripts/gen-strategy-catalogue.py --check
        # Note: -race is intentionally disabled in CI for now. There are two
        # known data races: (1) a real race in internal/host/codex/appserver_test.go
        # (fracta-owned, fixable), and (2) a race in the go-keyring v0.2.8 mock
        # provider used by internal/oauth tests (third-party, not our bug).
        # Both are tracked for fix; in the meantime we run vanilla tests.
