name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          BIN="fracta-${VERSION}-${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" \
            .
          (cd dist && sha256sum "${BIN}" > "${BIN}.sha256")
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fracta-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  package-scaffolds:
    name: Package scaffolds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build scaffold tarballs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for kind in local docker-compose k8s; do
            tar -C internal/project/scaffolds/templates -czf "dist/scaffold-${kind}-${VERSION}.tar.gz" "${kind}"
            (cd dist && sha256sum "scaffold-${kind}-${VERSION}.tar.gz" > "scaffold-${kind}-${VERSION}.tar.gz.sha256")
          done
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scaffolds-${{ github.ref_name }}
          path: dist/scaffold-*
          retention-days: 14

  release:
    name: Publish release
    needs: [build, package-scaffolds]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/fracta-*-linux-amd64
            dist/fracta-*-linux-amd64.sha256
            dist/fracta-*-linux-arm64
            dist/fracta-*-linux-arm64.sha256
            dist/fracta-*-darwin-amd64
            dist/fracta-*-darwin-amd64.sha256
            dist/fracta-*-darwin-arm64
            dist/fracta-*-darwin-arm64.sha256
            dist/scaffold-local-*.tar.gz
            dist/scaffold-local-*.tar.gz.sha256
            dist/scaffold-docker-compose-*.tar.gz
            dist/scaffold-docker-compose-*.tar.gz.sha256
            dist/scaffold-k8s-*.tar.gz
            dist/scaffold-k8s-*.tar.gz.sha256

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
